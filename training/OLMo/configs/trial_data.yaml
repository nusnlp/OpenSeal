run_name: print-data
save_folder: workspace/${run_name}
global_train_batch_size: 8

data:
  pad_direction: right
  # generate_doc_lengths: true
  num_workers: 1
  drop_last: true
  pin_memory: true
  prefetch_factor: 8
  persistent_workers: true
  memmap_dtype: uint32
  timeout: 0
  instance_filter:
    repetition_max_period: 13
    repetition_min_period: 1
    repetition_max_count: 32
  paths:
  - /scratch/mrqorib/DCLM/part-000-00000.npy
  - /scratch/mrqorib/DCLM/part-000-00001.npy
  - /scratch/mrqorib/DCLM/part-000-00002.npy